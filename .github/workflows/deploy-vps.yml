name: Deploy to VPS

on:
  push:
    branches: [vps-deploy]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build notification-mcp image and deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build notification-mcp image
        run: |
          docker buildx build --load \
            -f deploy/Dockerfile.vps \
            -t notification-mcp:latest .

      - name: Save image as tarball
        run: docker save notification-mcp:latest | gzip > notification-mcp.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: mgrinberg
          key: ${{ secrets.VPS_SSH_KEY }}
          source: notification-mcp.tar.gz
          target: /tmp/

      - name: Load image on VPS (service is paused, no auto-start)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: mgrinberg
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker load < /tmp/notification-mcp.tar.gz
            rm /tmp/notification-mcp.tar.gz
