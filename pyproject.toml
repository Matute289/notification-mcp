[project]
name = "notification-mcp"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "slowapi>=0.1.9",
    "asyncpg>=0.29",
    "cyclopts>=2.0",
    "uvloop>=0.20; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
